name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: make all test
      - run: ./build/experiment --audit examples/obstacles.csv examples/candidates.csv
      - run: ./build/experiment
      - run: make sanitize
      - name: Qualify retrospective evaluator without downloading data
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install numpy==1.26.4 pandas==2.2.3 pyarrow==18.1.0
          .ci-venv/bin/python -m unittest discover -s evaluation -v
