name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make all test
      - run: ./build/experiment --audit examples/obstacles.csv examples/candidates.csv
      - run: ./build/experiment
      - run: make sanitize
